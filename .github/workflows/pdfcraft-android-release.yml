name: Build and release PdfCraft Android APK

# Every release of upstream PdfCraft (storytold/pdfcraft) gets a matching Android release here, with the
# same tag (for example v0.16.1). It is checked once a day and builds only when upstream has published
# a release that this repository has no release for yet. Changes upstream makes between releases are ignored.
#
# Run it by hand with "Publish a release" switched off to only build: the signed APK is kept as a download
# on the run page (Artifacts) and nothing is released, tagged or committed.
#
# Everything about the layer itself (how it is applied, the release notes, the features list) lives inside
# android-layer/pdfcraft-android-layer.tar.gz, so this file rarely needs editing.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to build, e.g. v0.16.1 (empty = newest upstream release)"
        required: false
        default: ""
      force:
        description: "Build again even if this upstream version already has a release"
        type: boolean
        default: false
      publish:
        description: "Publish a release (switch off to only build the APK and download it from this run)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/pdfcraft
  TARGET: aarch64-linux-android
  NDK_VERSION: 28.2.13676358
  BT_VERSION: 35.0.0
  MIN_RUST: "1.95"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Find the upstream release to build
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          # Scheduled runs have no inputs: they always publish.
          PUBLISH="${INPUT_PUBLISH:-true}"
          TAG="$INPUT_REF"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          fi
          VER="${TAG#v}"
          SKIP=false
          echo "Upstream release: $TAG"
          if [ "$PUBLISH" = "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            else
              echo "Release $TAG already exists - nothing to do."
              SKIP=true
            fi
          fi
          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "skip=$SKIP"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - name: Check out this repository (the Android layer lives here)
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream PdfCraft at that release
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ver.outputs.tag }}
          path: src

      - name: Add the Android layer on top of upstream
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/layer"
          tar xzf ../fork/android-layer/pdfcraft-android-layer.tar.gz -C "$RUNNER_TEMP/layer"
          python3 "$RUNNER_TEMP/layer/apply_layer.py"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Rust version upstream asks for
        if: steps.ver.outputs.skip != 'true'
        run: |
          # Never go below MIN_RUST (the egui family needs it even where the workspace says less).
          RUSTV=$(grep -m1 '^rust-version' src/Cargo.toml | cut -d'"' -f2)
          RUSTV=$(printf '%s\n%s\n' "${RUSTV:-$MIN_RUST}" "$MIN_RUST" | sort -V | tail -n1)
          rustup toolchain install "$RUSTV" --profile minimal --target "$TARGET"
          rustup default "$RUSTV"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src
          key: android-arm64

      - name: Install Android SDK parts
        if: steps.ver.outputs.skip != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;${BT_VERSION}" "ndk;${NDK_VERSION}"

      - name: Build native library (Rust)
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo build -p pdfcraft-android --target "$TARGET" --release -j 3

      - name: Restore signing key
        if: steps.ver.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/pdfcraft-signing
          key: pdfcraft-signing-v1

      - name: Create signing key if missing
        if: steps.ver.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/pdfcraft-signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ~/pdfcraft-signing/key.p12
            printf '%s' "$KS_PASS" > ~/pdfcraft-signing/password.txt
          elif [ ! -f ~/pdfcraft-signing/key.p12 ]; then
            openssl rand -base64 24 > ~/pdfcraft-signing/password.txt
            keytool -genkeypair -keystore ~/pdfcraft-signing/key.p12 -storetype PKCS12 \
              -storepass:file ~/pdfcraft-signing/password.txt -alias pdfcraft \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=PdfCraft Personal Android Build"
          fi

      - name: Package and sign the APK
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BT_VERSION}"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          B="$RUNNER_TEMP/apk"
          mkdir -p "$B/classes" "$B/dex" "$B/res/drawable" dist
          cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.pdfcraft.png "$B/res/drawable/icon.png"

          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d "$B/classes" \
            packaging/android/java/ai/storyteller/pdfcraft/*.java
          jar cf "$B/classes.jar" -C "$B/classes" .
          "$BT/d8" --release --min-api 28 --lib "$PLATFORM" --output "$B/dex" "$B/classes.jar"
          "$BT/aapt2" compile --dir "$B/res" -o "$B/resources.zip"
          "$BT/aapt2" link -I "$PLATFORM" --manifest packaging/android/AndroidManifest.xml \
            --version-code "$(( $(date +%s) / 60 ))" --version-name "${TAG}" \
            -o "$B/unsigned.apk" "$B/resources.zip"

          B="$B" LIB="target/${TARGET}/release/libpdfcraft_android.so" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          b = Path(os.environ["B"])
          with zipfile.ZipFile(b / "unsigned.apk", "a", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(b / "dex/classes.dex", "classes.dex")
              z.write(os.environ["LIB"], "lib/arm64-v8a/libpdfcraft_android.so")
              for p in ["LICENSE-MIT", "LICENSE-APACHE", "ATTRIBUTION.md",
                        "assets/app-icon/LICENSE.txt", "vendor/winit/LICENSE"]:
                  if Path(p).exists():
                      z.write(p, "assets/licenses/" + p.replace("/", "_"))
          PY

          "$BT/zipalign" -f -P 16 4 "$B/unsigned.apk" "$B/aligned.apk"
          APK="dist/PdfCraft-${VERSION}-android-arm64-v8a.apk"
          "$BT/apksigner" sign --ks ~/pdfcraft-signing/key.p12 --ks-key-alias pdfcraft \
            --ks-pass "file:$HOME/pdfcraft-signing/password.txt" --out "$APK" "$B/aligned.apk"
          "$BT/apksigner" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Keep the APK (build only)
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-android-apk
          path: src/dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Release notes, in this order:
          #  1. The Android features that are new in this build: the topmost "## ..." section of
          #     whats-new.md inside the layer zip (written with every zip). Left out when the previous
          #     release already showed the same section, so old news never repeats.
          #  2. What upstream says is new in this version (its own release notes, without contributors).
          #  3. Install notes.
          NEWS="$RUNNER_TEMP/layer/whats-new.md"
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --exclude-drafts --json tagName \
            | jq -r --arg t "$TAG" '[.[] | select(.tagName != $t)][0].tagName // empty')
          PREV_BODY=""
          if [ -n "$PREV_TAG" ]; then
            PREV_BODY=$(gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          fi
          TOP=""
          if [ -f "$NEWS" ]; then
            TOP=$(awk '/^## /{ if (seen) exit; seen = 1; next } seen' "$NEWS")
          fi
          TOP_ID=$(printf '%s' "$TOP" | sha1sum | cut -c1-12)

          gh release view "$TAG" --repo "$UPSTREAM" --json body --jq .body > upstream-raw.md 2>/dev/null || true
          # Keep the notes about the app, not about the people: no "Contributors" sections and no
          # "by @name" credits; the "Full Changelog" link stays.
          awk '/^#+ /{skip = ($0 ~ /[Cc]ontributor/)} /^\*\*Full Changelog/{skip=0} !skip{print}' upstream-raw.md \
            | sed -E 's/ by @[A-Za-z0-9][A-Za-z0-9-]*( in |$)/\1/g; /^[Tt]hanks to .*@/d' > upstream-notes.md
          if ! grep -q '[^[:space:]]' upstream-notes.md; then
            echo "See the upstream release notes: https://github.com/${UPSTREAM}/releases/tag/${TAG}" > upstream-notes.md
          fi

          {
            if [ -n "$(printf '%s' "$TOP" | tr -d '[:space:]')" ] && ! printf '%s' "$PREV_BODY" | grep -qF "android-news:${TOP_ID}"; then
              HEAD=$(awk '/^## /{ sub(/^## /, ""); print; exit }' "$NEWS")
              echo "## New in the Android edition: ${HEAD}"
              echo
              printf '%s\n' "$TOP"
              echo
            fi
            echo "## What's new in PdfCraft ${VERSION}"
            echo
            cat upstream-notes.md
            echo
            echo "## About this build"
            echo "**PdfCraft ${VERSION} for Android** (ARM64), built automatically from upstream release \`${TAG}\` of \`${UPSTREAM}\` with the Android edition's layer applied."
            echo
            echo "- Needs an ARM64 phone or tablet running Android 9 or newer with a Vulkan GPU."
            echo "- Download the \`.apk\`, open it, and allow installs from your file manager or browser when Android asks."
            echo "- No storage permission is needed: Open, Save As and Export use Android's own file picker."
            echo "- Early preview: no system clipboard or printing yet. A hardware keyboard is recommended."
            echo "- Unofficial build, not made or supported by the PdfCraft team. If an update will not install over an older build, uninstall the old one first."
            echo
            echo "<!-- android-news:${TOP_ID} -->"
          } > notes.md

          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PdfCraft ${VERSION} Android" --notes-file notes.md

      - name: Keep the README's Android features list current
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        working-directory: fork
        run: |
          # Every "- " feature line of whats-new.md (all sections, so a feature stays listed after it
          # stops being news) goes between the markers in README.md. Fixes are written with "* " and are
          # not listed. If the markers are missing they are added at the end of the README.
          python3 - "$RUNNER_TEMP/layer/whats-new.md" <<'PY'
          import re, sys, pathlib
          news = pathlib.Path(sys.argv[1])
          if not news.exists():
              sys.exit(0)
          features = [l.rstrip() for l in news.read_text(encoding="utf-8").splitlines() if l.startswith("- ")]
          start, end = "<!-- android-features:start -->", "<!-- android-features:end -->"
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8") if readme.exists() else ""
          if start not in text:
              text = text.rstrip() + f"\n\n## Android features\n\nKept up to date automatically from each release.\n\n{start}\n{end}\n"
          block = start + "\n" + "\n".join(features) + "\n" + end
          text = re.sub(re.escape(start) + r".*?" + re.escape(end), lambda m: block, text, flags=re.S)
          readme.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update the Android features list in README [skip ci]"
            BR="${GITHUB_REF_NAME}"
            git pull --rebase -q origin "$BR" || true
            git push origin "HEAD:${BR}" || echo "::warning::couldn't push the README update (the branch moved meanwhile)"
          fi
